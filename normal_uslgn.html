<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Viewer Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --zenith-red: #ff2d2d;
            --zenith-blue: #00d2ff;
            --bg-black: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .splash-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }

        .splash-red {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 45, 45, 0.12) 0%, transparent 70%);
            filter: blur(60px);
            animation: float 20s infinite alternate;
        }

        .splash-blue {
            position: absolute;
            bottom: 10%;
            right: 15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.1) 0%, transparent 70%);
            filter: blur(60px);
            animation: float 15s infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        .login-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 50px;
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(40px);
            text-align: center;
            border-top: 2px solid var(--zenith-red);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        .heading-font { 
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 0.4em;
        }

        .input-zenith {
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            padding: 14px 15px;
            color: white;
            outline: none;
            transition: all 0.3s;
            font-size: 13px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        /* SECURITY FIX: Use text-security to hide input instead of type="password" 
           This prevents browsers from checking the "password" against breach databases */
        .mask-input {
            -webkit-text-security: disc !important;
            text-security: disc !important;
        }

        .input-zenith:focus {
            border-color: var(--zenith-blue);
            background: rgba(0, 210, 255, 0.03);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: var(--zenith-red);
            color: white;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(255, 45, 45, 0.3);
        }

        .action-btn:hover {
            background: white;
            color: black;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
        }

        #message-box {
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 20px;
            height: 15px;
            transition: all 0.3s;
        }

        .error { color: var(--zenith-red); }
        .success { color: var(--zenith-blue); }

        .toggle-link {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-link:hover {
            color: var(--zenith-blue);
        }

        .sub-link {
            font-size: 10px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .sub-link:hover {
            color: white;
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="splash-red"></div>
        <div class="splash-blue"></div>
    </div>

    <div class="login-box">
        <div class="heading-font text-2xl mb-2 text-white">ZENITH</div>
        <p id="portal-title" class="text-[9px] text-neutral-500 mb-10 tracking-[0.3em] uppercase">Security Portal: Login</p>

        <div id="auth-container">
            <input type="text" id="v_id" class="input-zenith" placeholder="IDENTIFIER" autocomplete="off">
            <!-- Using type="text" with mask-input class to bypass browser password breach checks -->
            <input type="text" id="v_key" class="input-zenith mask-input" placeholder="ACCESS KEY" autocomplete="off" spellcheck="false">
            
            <button type="button" id="main-btn" onclick="handleAuth()" class="action-btn">Initialize Session</button>
            <div id="message-box"></div>
        </div>

        <div class="mt-8">
            <span id="toggle-text" class="toggle-link" onclick="toggleMode()">New User? Create Identity</span>
        </div>

        <div class="mt-12 pt-8 border-t border-white/5 flex flex-col gap-4">
            <a href="index.html" class="sub-link">Exit to Public Stream</a>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('portal-title');
            const btn = document.getElementById('main-btn');
            const toggle = document.getElementById('toggle-text');
            const msg = document.getElementById('message-box');
            
            msg.innerHTML = "";
            
            if (isLoginMode) {
                title.innerText = "Security Portal: Login";
                btn.innerText = "Initialize Session";
                toggle.innerText = "New User? Create Identity";
            } else {
                title.innerText = "Security Portal: Registration";
                btn.innerText = "Create Account";
                toggle.innerText = "Already registered? Login";
            }
        }

        function showMessage(text, isError = true) {
            const msg = document.getElementById('message-box');
            msg.innerText = text;
            msg.className = isError ? "error" : "success";
            setTimeout(() => { msg.innerText = ""; }, 4000);
        }

        function handleAuth() {
            const user = document.getElementById('v_id').value.trim();
            const pass = document.getElementById('v_key').value;

            if (user.length < 3 || pass.length < 4) {
                showMessage("Credentials too short");
                return;
            }

            let users = JSON.parse(localStorage.getItem('zenith_users') || '[]');

            if (isLoginMode) {
                const foundUser = users.find(u => u.username.toLowerCase() === user.toLowerCase() && u.password === pass);
                
                if (foundUser) {
                    localStorage.setItem('zenith_session_user', foundUser.username);
                    window.location.href = 'norm_viewerpage.html';
                } else {
                    showMessage("Invalid Credentials");
                }
            } else {
                const exists = users.some(u => u.username.toLowerCase() === user.toLowerCase());
                
                if (exists) {
                    showMessage("Identifier already taken");
                } else {
                    users.push({
                        username: user,
                        password: pass,
                        age: '',
                        gender: 'Unspecified',
                        bio: 'Identity established.',
                        history: []
                    });
                    localStorage.setItem('zenith_users', JSON.stringify(users));
                    showMessage("Account Created! You can login.", false);
                    toggleMode();
                }
            }
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAuth();
        });
    </script>
</body>
</html>
