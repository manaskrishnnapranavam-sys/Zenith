<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | The Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --sidebar: #0a0a0a; --accent: #ff2d2d; --glass: rgba(255, 255, 255, 0.03); }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .heading-font { font-family: 'Syncopate', sans-serif; }
        .mono-font { font-family: 'Fira Code', monospace; }
        aside { width: 280px; background: var(--sidebar); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 30px; flex-shrink: 0; }
        .admin-profile { padding: 20px; background: rgba(255,255,255,0.02); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 30px; display: flex; align-items: center; gap: 12px; }
        .profile-avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(45deg, var(--accent), #4a00e0); display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: 'Syncopate'; font-size: 18px; box-shadow: 0 0 15px rgba(255, 45, 45, 0.3); }
        .nav-item { padding: 12px 16px; border-radius: 8px; color: #888; cursor: pointer; transition: all 0.3s; margin-bottom: 8px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item.active { background: rgba(255, 45, 45, 0.1); color: var(--accent); }
        main { flex: 1; padding: 50px; overflow-y: auto; background: radial-gradient(circle at top right, #1a0505 0%, transparent 40%); }
        .form-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.05); padding: 30px; border-radius: 16px; backdrop-filter: blur(20px); }
        .input-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; width: 100%; color: white; outline: none; margin-top: 6px; font-size: 13px; }
        .input-box:focus { border-color: var(--accent); }
        .btn-primary { background: var(--accent); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: all 0.2s; }
        .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px 16px; border-radius: 6px; font-size: 11px; }
        table { width: 100%; text-align: left; border-collapse: separate; border-spacing: 0 8px; }
        th { padding: 15px; color: #666; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; }
        td { padding: 15px; background: rgba(255,255,255,0.02); font-size: 13px; }
        td:first-child { border-radius: 8px 0 0 8px; }
        td:last-child { border-radius: 0 8px 8px 0; }
        .badge-red { background: #ff2d2d; color: white; padding: 2px 8px; border-radius: 2px; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        .badge-blue { background: #0084ff; color: white; padding: 2px 8px; border-radius: 2px; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        .file-label { display: block; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; text-align: center; font-size: 11px; color: #aaa; cursor: pointer; }
        .status-box { font-size: 10px; color: #666; margin-top: 5px; font-family: monospace; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <aside>
        <div class="heading-font text-xl mb-8 tracking-tighter text-white">ZENITH</div>
        <div class="admin-profile">
            <div class="profile-avatar">Z</div>
            <div>
                <div class="text-[12px] font-bold tracking-wide">ARCHITECT</div>
                <div class="text-[9px] text-red-500 uppercase tracking-widest font-bold">Root Access</div>
            </div>
        </div>
        <nav id="sidebar-nav">
            <div class="nav-item active" onclick="switchTab('releases')">Release Forge</div>
            <div class="nav-item" onclick="switchTab('edit')">Registry Edit</div>
            <div class="nav-item" onclick="switchTab('database')">System Database</div>
        </nav>
    </aside>

    <main>
        <div id="releases-tab">
            <h1 class="text-3xl font-bold mb-2">Release Forge</h1>
            <p class="text-neutral-500 mb-10">Configure cinematic assets via Local Storage or External URLs.</p>
            
            <div class="grid grid-cols-2 gap-10">
                <div class="form-card">
                    <h2 class="text-lg font-bold mb-6">Metadata</h2>
                    <div class="space-y-4">
                        <input type="text" id="m-title" class="input-box" placeholder="Project Title">
                        <input type="text" id="m-genre" class="input-box" placeholder="Genre">
                        <input type="text" id="m-marketing" class="input-box" placeholder="Marketing (NEW RELEASE, etc)">
                        <textarea id="m-plot" class="input-box h-32" placeholder="Summary"></textarea>
                    </div>
                </div>

                <div class="form-card">
                    <h2 class="text-lg font-bold mb-6">Assets (Upload OR Link)</h2>
                    <div class="space-y-6">
                        <input type="text" id="m-video-url" class="input-box" placeholder="Google Drive Link">
                        
                        <!-- Landscape Configuration -->
                        <div class="p-4 bg-white/5 rounded-xl border border-white/5">
                            <label class="text-[10px] uppercase tracking-widest text-neutral-500">Landscape (Billboard)</label>
                            <input type="text" id="m-land-link" class="input-box mb-2" placeholder="Paste Imgur Link (Optional)" oninput="checkAssetStatus()">
                            <input type="file" id="land-up" class="hidden" accept="image/*" onchange="handleFileUpload(this, 'm-land-data', 'land-status')">
                            <label for="land-up" class="file-label" id="land-status">OR Upload Image File</label>
                            <input type="hidden" id="m-land-data">
                        </div>

                        <!-- Portrait Configuration -->
                        <div class="p-4 bg-white/5 rounded-xl border border-white/5">
                            <label class="text-[10px] uppercase tracking-widest text-neutral-500">Portrait (Poster)</label>
                            <input type="text" id="m-port-link" class="input-box mb-2" placeholder="Paste Imgur Link (Optional)" oninput="checkAssetStatus()">
                            <input type="file" id="port-up" class="hidden" accept="image/*" onchange="handleFileUpload(this, 'm-port-data', 'port-status')">
                            <label for="port-up" class="file-label" id="port-status">OR Upload Image File</label>
                            <input type="hidden" id="m-port-data">
                        </div>

                        <button onclick="addMovie()" class="btn-primary w-full uppercase tracking-widest text-xs">Authorize Publication</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="edit-tab" class="hidden">
             <h1 class="text-3xl font-bold mb-2">Registry Edit</h1>
             <div class="form-card"><table id="movie-registry-table"><thead><tr><th>TITLE</th><th>PROMO</th><th>SOURCE</th><th>ACTIONS</th></tr></thead><tbody id="registry-list"></tbody></table></div>
        </div>

        <div id="database-tab" class="hidden">
            <h1 class="text-3xl font-bold mb-4">Database Export</h1>
            <div class="form-card"><pre id="js-output" class="bg-black p-6 rounded-lg text-[11px] text-green-400 overflow-auto max-h-[500px]"></pre></div>
            <button onclick="downloadJS()" class="btn-primary mt-4">Download movies.js</button>
        </div>
    </main>

    <script>
        let movies = JSON.parse(localStorage.getItem('zenith_lifetime_movies') || '[]');

        function handleFileUpload(input, targetId, statusId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById(targetId).value = e.target.result;
                    document.getElementById(statusId).innerText = "File Encoded (Ready)";
                    document.getElementById(statusId).style.borderColor = "#00ff00";
                };
                reader.readAsDataURL(file);
            }
        }

        function checkAssetStatus() {
            // UI feedback logic can go here
        }

        function convertToPreviewUrl(url) {
            if (!url) return "";
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            return match ? `https://drive.google.com/file/d/${match[1]}/preview` : url;
        }

        function addMovie() {
            const title = document.getElementById('m-title').value.trim();
            if(!title) return alert("Title required.");

            // Choose Link if provided, otherwise choose Encoded Data
            const landscape = document.getElementById('m-land-link').value || document.getElementById('m-land-data').value;
            const portrait = document.getElementById('m-port-link').value || document.getElementById('m-port-data').value;

            const movie = {
                id: "ZEN-" + Date.now(),
                title: title,
                genre: document.getElementById('m-genre').value || "Action",
                marketingTag: document.getElementById('m-marketing').value || "ZENITH PRIME",
                plot: document.getElementById('m-plot').value,
                videoFile: convertToPreviewUrl(document.getElementById('m-video-url').value),
                posterLandscape: landscape,
                posterPortrait: portrait,
                isFeatured: true
            };

            movies.push(movie);
            localStorage.setItem('zenith_lifetime_movies', JSON.stringify(movies));
            alert("RECORD AUTHORIZED");
            location.reload();
        }

        function renderRegistry() {
            const list = document.getElementById('registry-list');
            list.innerHTML = movies.map(m => `
                <tr>
                    <td class="font-bold">${m.title}</td>
                    <td><span class="badge-red">${m.marketingTag}</span></td>
                    <td><span class="text-[9px] uppercase">${m.posterLandscape.startsWith('http') ? 'External Link' : 'Local Storage'}</span></td>
                    <td><button onclick="deleteMovie('${m.id}')" class="text-red-500 text-xs font-bold">WIPE</button></td>
                </tr>
            `).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(tabId + '-tab').classList.remove('hidden');
            if(tabId === 'edit') renderRegistry();
            if(tabId === 'database') {
                const code = `const movieData = ${JSON.stringify(movies, null, 4)};\n\nif (typeof module !== 'undefined') { module.exports = movieData; }`;
                document.getElementById('js-output').textContent = code;
            }
        }

        function deleteMovie(id) {
            movies = movies.filter(m => m.id !== id);
            localStorage.setItem('zenith_lifetime_movies', JSON.stringify(movies));
            renderRegistry();
        }

        function downloadJS() {
            const blob = new Blob([document.getElementById('js-output').textContent], {type: 'text/javascript'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'movies.js';
            a.click();
        }
    </script>
</body>
</html>
