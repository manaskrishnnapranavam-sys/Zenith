<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Zero Point Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="movies.js" onerror="console.warn('movies.js not found. Please upload via Admin Forge.')"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #ff2d2d;
            --zenith-blue: #0084ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .heading-font {
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 0.3em;
        }

        .mono-font { font-family: 'Fira Code', monospace; }

        /* --- DYNAMIC SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.8s ease-out;
        }

        .splash-bg-animate {
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle at 30% 30%, #4a0000 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, #800000 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, #200000 0%, transparent 60%);
            filter: blur(80px);
            opacity: 0.6;
            animation: move-colors 10s infinite alternate ease-in-out;
        }

        @keyframes move-colors {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(5deg); }
        }

        .splash-logo {
            font-size: 3.5rem;
            z-index: 10;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            animation: logo-stay 3.5s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes logo-stay {
            0% { filter: blur(35px); opacity: 0; transform: scale(0.85); letter-spacing: 1em; }
            25% { filter: blur(0px); opacity: 1; transform: scale(1); letter-spacing: 0.3em; }
            85% { filter: blur(0px); opacity: 1; transform: scale(1); }
            100% { filter: blur(50px); opacity: 0; transform: scale(1.1); }
        }

        /* --- LOGIN GATE --- */
        #login-gate {
            position: fixed;
            inset: 0;
            z-index: 1500;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(30px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .gate-card {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 480px;
            width: 100%;
            padding: 50px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 80px rgba(255,0,0,0.1);
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        #login-gate.visible { opacity: 1; }
        #login-gate.visible .gate-card { transform: translateY(0); }

        /* --- HERO SLIDER (LANDSCAPE OPTIMIZED) --- */
        .hero-slider {
            position: relative;
            height: 65vh; 
            width: 100%;
            overflow: hidden;
            background: #000;
            margin-bottom: 80px; /* CREATED GAP HERE */
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 10%;
        }

        .slide.active { opacity: 1; z-index: 5; }

        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 30%, var(--bg) 100%),
                        linear-gradient(to right, var(--bg) 0%, transparent 70%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 500px;
            transform: translateX(-40px);
            opacity: 0;
            transition: all 1s ease 0.5s;
        }

        .slide.active .hero-content {
            transform: translateX(0);
            opacity: 1;
        }

        /* Plot Truncation */
        .hero-plot {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.6;
        }

        /* --- NAV --- */
        #navbar {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            transition: all 0.6s ease;
        }

        .portal-btn-blue, .portal-btn-red {
            font-size: 10px;
            letter-spacing: 0.25em;
            padding: 10px 24px;
            border-radius: 2px;
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            transition: all 0.4s ease;
        }

        .portal-btn-blue:hover { background: var(--zenith-blue); border-color: var(--zenith-blue); }
        .portal-btn-red:hover { background: var(--accent); border-color: var(--accent); }

        .badge-red { background: var(--accent); color: white; padding: 4px 10px; border-radius: 2px; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .badge-blue { background: var(--zenith-blue); color: white; padding: 4px 10px; border-radius: 2px; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        /* --- GRID --- */
        #master-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            padding: 0 5% 100px 5%;
        }

        .movie-card {
            aspect-ratio: 2/3;
            background: #111;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            transition: all 0.5s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-card:hover { transform: translateY(-8px); border-color: var(--accent); }

        .movie-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
        .movie-card:hover img { transform: scale(1.08); }

        .catalog-header { position: relative; padding-left: 20px; }
        .catalog-header::before { content: ""; position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: var(--accent); }

        #details-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.98);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="overflow-hidden">

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-bg-animate"></div>
        <div class="splash-logo heading-font font-bold text-white text-center uppercase">Zero Point</div>
    </div>

    <!-- Login Gate -->
    <div id="login-gate">
        <div class="gate-card">
            <button onclick="closeGate()" class="absolute top-6 right-6 text-neutral-600 hover:text-white transition-colors">✕</button>
            <div class="mono-font text-white/40 text-[9px] tracking-[0.5em] mb-4 uppercase">Elite Archive Access</div>
            <h2 class="heading-font text-2xl mb-6 tracking-widest text-white">WELCOME BACK</h2>
            <p class="text-neutral-500 text-[11px] mb-10 leading-relaxed uppercase tracking-widest max-w-[300px] mx-auto">Verify identity to unlock personalized vaults.</p>
            <div class="flex flex-col gap-3">
                <button id="gate-main-btn" onclick="handleGateLogin()" class="bg-white text-black hover:bg-red-600 hover:text-white py-4 font-bold tracking-[0.3em] text-[10px] uppercase transition-all duration-300">Authorize Identity</button>
                <button onclick="closeGate()" class="border border-white/5 hover:bg-white/5 text-neutral-600 hover:text-neutral-300 py-4 font-bold tracking-[0.3em] text-[10px] uppercase transition-all duration-300">Explore as Guest</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="opacity-0 transition-opacity duration-[2000ms]">
        <nav id="navbar" class="fixed top-0 w-full z-50 px-12 py-8 flex justify-between items-center">
            <div class="heading-font text-2xl font-bold text-white tracking-tighter cursor-pointer" onclick="location.reload()">ZENITH</div>
            <div class="flex items-center gap-6">
                <button class="portal-btn-blue" onclick="location.href='normal_uslgn.html'">VIEWER PORTAL</button>
                <button class="portal-btn-red" onclick="location.href='adminlgn.html'">THE ARCHITECT</button>
            </div>
        </nav>

        <!-- The Billboard -->
        <div id="hero-slider" class="hero-slider">
            <div id="hero-slides-container"></div>
        </div>

        <main class="relative z-10 pb-20">
            <!-- Header Section -->
            <div class="px-[5%] mb-12 flex justify-between items-end">
                <div class="catalog-header">
                    <div class="text-[9px] text-red-500 mono-font font-bold mb-1 tracking-[0.4em] uppercase">Archive_System</div>
                    <h2 class="heading-font text-3xl font-bold tracking-tighter uppercase">Primary_Database</h2>
                </div>
                <div class="flex flex-col items-end">
                    <span id="movie-count" class="mono-font text-[9px] text-neutral-600 tracking-[0.3em] uppercase">Nodes Active</span>
                    <div class="h-[2px] w-32 bg-red-600 mt-2"></div>
                </div>
            </div>
            
            <div id="master-grid"></div>
        </main>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" onclick="closeDetails()">
        <div class="w-full max-w-6xl bg-[#050505] border border-white/5 relative overflow-hidden" onclick="event.stopPropagation()">
            <button class="absolute top-8 right-8 z-50 text-neutral-500 hover:text-white" onclick="closeDetails()">✕</button>
            <div id="modal-hero" class="h-[450px] bg-cover bg-center relative">
                <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-transparent to-transparent"></div>
            </div>
            <div class="p-16 -mt-32 relative z-10">
                <div class="flex gap-4 mb-6">
                    <span id="modal-marketing" class="badge-red"></span>
                    <span id="modal-genre-box" class="badge-blue"></span>
                </div>
                <h1 id="modal-title" class="text-5xl font-bold mb-6 uppercase tracking-tighter leading-none"></h1>
                <p id="modal-plot" class="text-neutral-400 text-lg leading-relaxed mb-10 max-w-3xl"></p>
                <button id="modal-play-btn" class="bg-red-600 text-white px-16 py-5 font-bold hover:bg-white hover:text-black tracking-widest text-xs uppercase transition-all">Initiate_Uplink</button>
            </div>
        </div>
    </div>

    <script>
        let currentSlide = 0;

        window.addEventListener('load', () => {
            renderContent(); 
            configureGate();
            startHeroCycle();
            
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const main = document.getElementById('main-app');
                const gate = document.getElementById('login-gate');
                
                splash.style.opacity = '0';
                main.style.opacity = '1';
                document.body.classList.remove('overflow-hidden');
                
                setTimeout(() => {
                    splash.style.display = 'none';
                    gate.style.display = 'flex';
                    requestAnimationFrame(() => gate.classList.add('visible'));
                }, 800); 
            }, 3500);
        });

        function startHeroCycle() {
            setInterval(() => {
                const slides = document.querySelectorAll('.slide');
                if (!slides.length) return;
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 7000);
        }

        function configureGate() {
            const isLoggedIn = localStorage.getItem('zenith_session_user');
            const btn = document.getElementById('gate-main-btn');
            if (isLoggedIn) {
                btn.innerText = "OPEN PERSONAL VAULT";
                btn.onclick = () => location.href = 'norm_viewerpage.html';
                btn.classList.add('bg-blue-600', 'text-white');
            }
        }

        function handleGateLogin() { window.location.href = 'normal_uslgn.html'; }
        function closeGate() {
            const gate = document.getElementById('login-gate');
            gate.classList.remove('visible');
            setTimeout(() => gate.style.display = 'none', 600);
        }

        function renderContent() {
            const grid = document.getElementById('master-grid');
            const heroContainer = document.getElementById('hero-slides-container');
            const countLabel = document.getElementById('movie-count');
            
            const localStore = JSON.parse(localStorage.getItem('zenith_lifetime_movies') || '[]');
            const activeData = localStore.length > 0 ? localStore : (typeof movieData !== 'undefined' ? movieData : []);

            if (!activeData.length) return;

            countLabel.innerText = `NODES: ${activeData.length}`;

            const featured = activeData.filter(m => m.isFeatured);
            heroContainer.innerHTML = (featured.length ? featured : activeData).map((movie, index) => `
                <div class="slide ${index === 0 ? 'active' : ''}" style="background-image: url('${movie.posterLandscape}');">
                    <div class="hero-content">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="badge-red">${movie.marketingTag || 'ORIGINAL'}</span>
                            <span class="badge-blue">${movie.genre}</span>
                        </div>
                        <h1 class="text-5xl font-bold mb-4 tracking-tighter uppercase leading-[0.9]">${movie.title}</h1>
                        <p class="hero-plot text-neutral-300 text-[13px] mb-8 max-w-sm">${movie.plot}</p>
                        <div class="flex gap-4">
                            <button class="bg-red-600 text-white px-8 py-3 font-bold text-[9px] tracking-[0.2em] uppercase hover:bg-white hover:text-black transition-all" onclick="redirectToPlayer('${movie.id}')">Watch Now</button>
                            <button class="border border-white/10 bg-black/40 backdrop-blur-md text-white px-8 py-3 font-bold text-[9px] tracking-[0.2em] uppercase hover:bg-white hover:text-black transition-all" onclick="showDetails('${movie.id}')">Info</button>
                        </div>
                    </div>
                </div>
            `).join('');

            grid.innerHTML = activeData.map(movie => `
                <div class="movie-card" onclick="showDetails('${movie.id}')">
                    <img src="${movie.posterPortrait}" alt="${movie.title}" loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent p-6 flex flex-col justify-end opacity-0 hover:opacity-100 transition-opacity">
                        <h4 class="font-bold text-xs uppercase tracking-tighter">${movie.title}</h4>
                        <div class="text-[8px] text-red-500 font-bold tracking-[0.1em] uppercase mt-1">${movie.genre}</div>
                    </div>
                </div>
            `).join('');
        }

        function showDetails(id) {
            const activeData = JSON.parse(localStorage.getItem('zenith_lifetime_movies') || '[]').length 
                ? JSON.parse(localStorage.getItem('zenith_lifetime_movies')) 
                : movieData;
            const movie = activeData.find(m => m.id === id);
            
            document.getElementById('modal-hero').style.backgroundImage = `url('${movie.posterLandscape}')`;
            document.getElementById('modal-title').innerText = movie.title;
            document.getElementById('modal-marketing').innerText = movie.marketingTag || 'ORIGINAL';
            document.getElementById('modal-genre-box').innerText = movie.genre;
            document.getElementById('modal-plot').innerText = movie.plot;
            document.getElementById('modal-play-btn').onclick = () => redirectToPlayer(movie.id);
            document.getElementById('details-modal').style.display = 'flex';
        }

        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; }
        function redirectToPlayer(id) { window.location.href = `video_player.html?id=${id}&origin=public`; }
    </script>
</body>
</html>
