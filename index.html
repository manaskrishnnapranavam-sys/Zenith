<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Zero Point Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <!-- This file is generated by the Admin Forge -->
    <script src="movies.js" onerror="console.warn('movies.js not found. Please upload via Admin Forge.')"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #ff2d2d;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .heading-font {
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 0.3em;
        }

        /* --- DYNAMIC SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 1s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .splash-bg-animate {
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle at 30% 30%, #4a0000 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, #800000 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, #200000 0%, transparent 60%);
            filter: blur(80px);
            opacity: 0.6;
            animation: move-colors 10s infinite alternate ease-in-out;
        }

        @keyframes move-colors {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(5deg); }
        }

        .splash-logo {
            font-size: 3.5rem;
            z-index: 10;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            animation: logo-stay 6s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes logo-stay {
            0% { filter: blur(35px); opacity: 0; transform: scale(0.85); letter-spacing: 1em; }
            25% { filter: blur(0px); opacity: 1; transform: scale(1); letter-spacing: 0.3em; }
            85% { filter: blur(0px); opacity: 1; transform: scale(1); }
            100% { filter: blur(50px); opacity: 0; transform: scale(1.1); }
        }

        /* --- SLIDING HERO (BILLBOARD) --- */
        .hero-slider {
            position: relative;
            height: 85vh;
            width: 100%;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 5%;
        }

        .slide.active { opacity: 1; z-index: 5; }

        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 30%, var(--bg) 100%),
                        linear-gradient(to right, rgba(5,5,5,0.8) 0%, transparent 60%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 700px;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.8s ease 0.4s;
            text-shadow: 0 4px 15px rgba(0,0,0,1);
        }

        .slide.active .hero-content {
            transform: translateY(0);
            opacity: 1;
        }

        .hero-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            padding: 20px;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s;
        }
        .hero-nav:hover { opacity: 1; transform: translateY(-50%) scale(1.1); color: var(--accent); }
        .hero-nav.prev { left: 20px; }
        .hero-nav.next { right: 20px; }

        /* --- PORTRAIT MOVIE GRID & HOVER EFFECTS --- */
        #master-grid {
            display: grid;
            /* Updated for Portrait layout: denser columns */
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 0 5% 100px 5%;
            transition: all 0.5s ease;
        }

        @media (min-width: 1024px) {
            #master-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }

        #master-grid:has(.movie-card:hover) .movie-card:not(:hover) {
            filter: blur(4px);
            opacity: 0.5;
            transform: scale(0.95);
        }

        .movie-card {
            aspect-ratio: 2/3; /* Standard Portrait Movie Poster Ratio */
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-card:hover {
            transform: scale(1.08) translateY(-5px);
            z-index: 50;
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .movie-card:hover img {
            transform: scale(1.1);
        }

        .movie-info-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .movie-card:hover .movie-info-overlay {
            opacity: 1;
        }

        .nav-scrolled {
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .portal-btn {
            font-size: 10px;
            letter-spacing: 0.1em;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            font-weight: 600;
        }
        .portal-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
        }

        /* --- MOVIE DETAILS MODAL --- */
        #details-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: #0a0a0a;
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            animation: modal-entry 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes modal-entry {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-hero {
            height: 400px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .modal-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, #0a0a0a);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: background 0.3s;
        }
        .close-modal:hover { background: var(--accent); }
    </style>
</head>
<body class="overflow-hidden">

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-bg-animate"></div>
        <div class="splash-logo heading-font font-bold text-white text-center">
            ZERO POINT
        </div>
    </div>

    <!-- Main App Content -->
    <div id="main-app" class="opacity-0 transition-opacity duration-[1500ms]">
        
        <nav id="navbar" class="fixed top-0 w-full z-50 px-12 py-5 flex justify-between items-center transition-all duration-500">
            <div class="flex items-center gap-12">
                <div class="heading-font text-2xl font-bold text-white tracking-tighter cursor-pointer" onclick="location.reload()">ZENITH</div>
            </div>
            
            <div class="flex items-center gap-4">
                <button class="portal-btn text-neutral-400 hover:text-white" onclick="location.href='normal_uslgn.html'">VIEWER PORTAL</button>
                <button class="portal-btn text-neutral-400 hover:text-white" onclick="location.href='adminlgn.html'">THE ARCHITECT</button>
            </div>
        </nav>

        <!-- Dynamic Hero Slider (Still Landscape for Cinematic Feel) -->
        <div id="hero-slider" class="hero-slider">
            <div class="hero-nav prev" onclick="manualSlide(-1)">
                <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
            </div>
            <div class="hero-nav next" onclick="manualSlide(1)">
                <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </div>
            <div id="hero-slides-container"></div>
        </div>

        <!-- Master Catalog -->
        <main class="relative -mt-20 z-10">
            <div class="px-[5%] mb-8 flex justify-between items-end">
                <h2 class="heading-font text-2xl font-bold border-l-4 border-red-600 pl-4">Master Catalog</h2>
                <span id="movie-count" class="text-xs text-neutral-500 tracking-widest uppercase">Initializing Vault...</span>
            </div>
            
            <div id="master-grid">
                <!-- Populated via JavaScript -->
            </div>
        </main>
    </div>

    <!-- Movie Details Modal -->
    <div id="details-modal" onclick="closeDetails(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="close-modal" onclick="closeDetails(event)">✕</div>
            <div id="modal-hero" class="modal-hero"></div>
            <div class="p-10 -mt-20 relative z-10">
                <h1 id="modal-title" class="text-6xl font-bold mb-2 uppercase tracking-tighter"></h1>
                <p id="modal-genre" class="text-red-500 font-bold tracking-widest text-sm mb-6"></p>
                <div class="grid grid-cols-3 gap-10">
                    <div class="col-span-2">
                        <p id="modal-plot" class="text-neutral-300 text-lg leading-relaxed mb-8"></p>
                        <button id="modal-play-btn" class="bg-white text-black px-12 py-4 rounded-sm font-bold text-xl hover:bg-red-600 hover:text-white transition-all transform hover:scale-105">PLAY NOW</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            renderContent(); 
            
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('main-app').style.opacity = '1';
                document.body.classList.remove('overflow-hidden');
                setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 1000);
            }, 6000);
        });

        function renderContent() {
            const grid = document.getElementById('master-grid');
            const heroContainer = document.getElementById('hero-slides-container');
            const countLabel = document.getElementById('movie-count');
            
            if (typeof movieData === 'undefined' || !movieData.length) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center opacity-50 italic">The vault is currently empty. Visit 'The Architect' portal to upload movies.</div>`;
                countLabel.innerText = "Vault Offline";
                return;
            }

            countLabel.innerText = `Streaming ${movieData.length} Productions`;

            // Render Hero (Still Landscape)
            const featuredMovies = movieData.filter(m => m.isFeatured);
            heroContainer.innerHTML = (featuredMovies.length ? featuredMovies : movieData).map((movie, index) => `
                <div class="slide ${index === 0 ? 'active' : ''}" style="background-image: url('${movie.posterLandscape}');">
                    <div class="hero-content">
                        <span class="bg-red-600 px-3 py-1 text-[10px] font-bold rounded-sm mb-4 inline-block tracking-widest">ZENITH FEATURE</span>
                        <h1 class="text-7xl font-bold mb-4 tracking-tighter leading-tight uppercase">${movie.title}</h1>
                        <p class="text-lg text-neutral-200 mb-8 leading-relaxed max-w-xl">${movie.plot}</p>
                        <div class="flex gap-4">
                            <button class="bg-white text-black px-12 py-3.5 rounded-sm font-bold hover:bg-red-600 hover:text-white transition-all" onclick="redirectToPlayer('${movie.id}')">Experience Now</button>
                            <button class="bg-black/50 backdrop-blur-md text-white border border-white/20 px-12 py-3.5 rounded-sm font-bold hover:bg-white hover:text-black transition-all" onclick="showDetails('${movie.id}')">View Details</button>
                        </div>
                    </div>
                </div>
            `).join('');

            // Render Portrait Grid
            grid.innerHTML = movieData.map(movie => `
                <div class="movie-card" onclick="showDetails('${movie.id}')">
                    <img src="${movie.posterPortrait}" alt="${movie.title}">
                    <div class="movie-info-overlay">
                        <h3 class="font-bold text-lg uppercase tracking-tighter leading-tight">${movie.title}</h3>
                        <p class="text-[9px] text-white/80 font-bold tracking-widest uppercase">${movie.genre}</p>
                    </div>
                </div>
            `).join('');

            startAutoSlide();
        }

        function showDetails(id) {
            const movie = movieData.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('modal-hero').style.backgroundImage = `url('${movie.posterLandscape}')`;
            document.getElementById('modal-title').innerText = movie.title;
            document.getElementById('modal-genre').innerText = movie.genre;
            document.getElementById('modal-plot').innerText = movie.plot;
            document.getElementById('modal-play-btn').onclick = () => redirectToPlayer(movie.id);
            
            const modal = document.getElementById('details-modal');
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeDetails(e) {
            document.getElementById('details-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function redirectToPlayer(movieId) {
            window.location.href = `video_player.html?id=${movieId}`;
        }

        let currentSlide = 0;
        let slideInterval;

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            if (slides.length <= 1) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function manualSlide(direction) {
            clearInterval(slideInterval);
            showSlide(currentSlide + direction);
            startAutoSlide();
        }

        function startAutoSlide() {
            slideInterval = setInterval(() => showSlide(currentSlide + 1), 8000);
        }

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            window.scrollY > 50 ? nav.classList.add('nav-scrolled') : nav.classList.remove('nav-scrolled');
        });
    </script>
</body>
</html>
