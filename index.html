<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Zero Point Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="movies.js" onerror="console.warn('movies.js not found. Please upload via Admin Forge.')"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #ff2d2d;
            --zenith-blue: #0084ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .heading-font {
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 0.3em;
        }

        .mono-font { font-family: 'Fira Code', monospace; }

        /* --- DYNAMIC SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 1s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .splash-bg-animate {
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle at 30% 30%, #4a0000 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, #800000 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, #200000 0%, transparent 60%);
            filter: blur(80px);
            opacity: 0.6;
            animation: move-colors 10s infinite alternate ease-in-out;
        }

        @keyframes move-colors {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(5deg); }
        }

        .splash-logo {
            font-size: 3.5rem;
            z-index: 10;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            animation: logo-stay 4s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes logo-stay {
            0% { filter: blur(35px); opacity: 0; transform: scale(0.85); letter-spacing: 1em; }
            25% { filter: blur(0px); opacity: 1; transform: scale(1); letter-spacing: 0.3em; }
            85% { filter: blur(0px); opacity: 1; transform: scale(1); }
            100% { filter: blur(50px); opacity: 0; transform: scale(1.1); }
        }

        /* --- LOGIN PROMPT MODAL --- */
        #login-gate {
            position: fixed;
            inset: 0;
            z-index: 900;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            display: none; /* Controlled by JS */
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .gate-card {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 50px rgba(255,0,0,0.1);
        }

        /* --- STYLIZED NAV BUTTONS --- */
        .portal-btn-blue {
            font-size: 10px;
            letter-spacing: 0.1em;
            padding: 10px 20px;
            border-radius: 4px;
            background: var(--zenith-blue);
            color: white;
            box-shadow: 0 0 20px rgba(0, 132, 255, 0.4);
            transition: all 0.3s;
            font-weight: 800;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .portal-btn-blue:hover { 
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 132, 255, 0.6);
            background: white;
            color: var(--zenith-blue);
        }

        .portal-btn-red {
            font-size: 10px;
            letter-spacing: 0.1em;
            padding: 10px 20px;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(255, 45, 45, 0.4);
            transition: all 0.3s;
            font-weight: 800;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .portal-btn-red:hover { 
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 45, 45, 0.6);
            background: white;
            color: var(--accent);
        }

        #navbar {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            backdrop-filter: blur(5px);
        }

        /* --- SLIDING HERO (BILLBOARD) --- */
        .hero-slider {
            position: relative;
            height: 85vh;
            width: 100%;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 5%;
        }

        .slide.active { opacity: 1; z-index: 5; }

        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 30%, var(--bg) 100%),
                        linear-gradient(to right, rgba(5,5,5,0.8) 0%, transparent 60%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 700px;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.8s ease 0.4s;
        }

        .slide.active .hero-content {
            transform: translateY(0);
            opacity: 1;
        }

        /* --- PORTRAIT MOVIE GRID --- */
        #master-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 0 5% 100px 5%;
        }

        .movie-card {
            aspect-ratio: 2/3;
            background: #111;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-card:hover {
            transform: scale(1.05);
            z-index: 10;
            border-color: var(--accent);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .catalog-header {
            position: relative;
            display: inline-block;
            overflow: hidden;
        }

        .catalog-header::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, var(--accent), transparent);
            height: 2px;
            animation: scan 3s infinite linear;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(300%); }
        }

        #details-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.95);
        }
    </style>
</head>
<body class="overflow-hidden">

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-bg-animate"></div>
        <div class="splash-logo heading-font font-bold text-white text-center">
            ZERO POINT
        </div>
    </div>

    <!-- System Initialization Gate (Login Prompt) -->
    <div id="login-gate">
        <div class="gate-card">
            <button onclick="closeGate()" class="absolute top-4 right-4 text-neutral-500 hover:text-white transition-colors" title="Dismiss">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="mono-font text-red-500 text-[10px] tracking-[0.3em] mb-4 uppercase">Identity_Check_V.04</div>
            <h2 class="heading-font text-xl mb-6">RESTRICTED ACCESS</h2>
            <p class="text-neutral-400 text-sm mb-8 leading-relaxed">System history and personalized archives are currently locked. Connect to your identity for the full Zenith experience.</p>
            <div class="flex flex-col gap-3">
                <button onclick="location.href='normal_uslgn.html'" class="bg-red-600 hover:bg-red-700 text-white py-4 font-bold tracking-widest text-xs uppercase transition-all shadow-lg shadow-red-900/20">Authorize Identity</button>
                <button onclick="closeGate()" class="border border-white/10 hover:bg-white/5 text-neutral-400 py-4 font-bold tracking-widest text-xs uppercase transition-all">Proceed as Guest</button>
            </div>
        </div>
    </div>

    <!-- Main App Content -->
    <div id="main-app" class="opacity-0 transition-opacity duration-[1500ms]">
        
        <nav id="navbar" class="fixed top-0 w-full z-50 px-12 py-5 flex justify-between items-center transition-all duration-500">
            <div class="flex items-center gap-12">
                <div class="heading-font text-2xl font-bold text-white tracking-tighter cursor-pointer" onclick="location.reload()">ZENITH</div>
            </div>
            
            <div class="flex items-center gap-4">
                <button class="portal-btn-blue" onclick="location.href='normal_uslgn.html'">VIEWER PORTAL</button>
                <button class="portal-btn-red" onclick="location.href='adminlgn.html'">THE ARCHITECT</button>
            </div>
        </nav>

        <div id="hero-slider" class="hero-slider">
            <div id="hero-slides-container"></div>
        </div>

        <main class="relative -mt-20 z-10 pb-20">
            <div class="px-[5%] mb-12 flex justify-between items-end">
                <div class="catalog-header">
                    <div class="text-[10px] text-red-500 mono-font font-bold mb-1 tracking-widest">SYSTEM_STATUS: ONLINE</div>
                    <h2 class="heading-font text-3xl font-bold tracking-tighter uppercase">Archive_Core // V.01</h2>
                </div>
                <div class="flex flex-col items-end">
                    <span id="movie-count" class="mono-font text-[10px] text-neutral-500 tracking-[0.2em] uppercase">Checking Vault Integrity...</span>
                    <div class="h-[1px] w-32 bg-red-600 mt-2"></div>
                </div>
            </div>
            
            <div id="master-grid"></div>
        </main>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" onclick="closeDetails()">
        <div class="w-full max-w-5xl bg-[#080808] border border-white/10 relative overflow-hidden" onclick="event.stopPropagation()">
            <button class="absolute top-6 right-6 z-50 bg-black/50 p-2 hover:bg-red-600 transition-colors" onclick="closeDetails()">✕</button>
            <div id="modal-hero" class="h-[400px] bg-cover bg-center relative">
                <div class="absolute inset-0 bg-gradient-to-t from-[#080808] via-transparent to-transparent"></div>
            </div>
            <div class="p-12 -mt-24 relative z-10">
                <h1 id="modal-title" class="text-5xl font-bold mb-2 uppercase tracking-tighter"></h1>
                <p id="modal-genre" class="text-red-500 font-bold tracking-widest text-xs mb-8 uppercase"></p>
                <p id="modal-plot" class="text-neutral-400 text-lg leading-relaxed mb-8 max-w-2xl"></p>
                <button id="modal-play-btn" class="bg-white text-black px-12 py-4 font-bold hover:bg-red-600 hover:text-white transition-all">STREAM_CONTENT</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            renderContent(); 
            
            // Splash timeline
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('main-app').style.opacity = '1';
                document.body.classList.remove('overflow-hidden');
                
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    // Show login gate IF no session exists
                    const session = localStorage.getItem('zenith_session_user');
                    if(!session) {
                        const gate = document.getElementById('login-gate');
                        gate.style.display = 'flex';
                        gate.style.opacity = '0';
                        setTimeout(() => gate.style.opacity = '1', 10);
                    }
                }, 1000);
            }, 4000);
        });

        function closeGate() {
            const gate = document.getElementById('login-gate');
            gate.style.opacity = '0';
            setTimeout(() => gate.style.display = 'none', 500);
        }

        function renderContent() {
            const grid = document.getElementById('master-grid');
            const heroContainer = document.getElementById('hero-slides-container');
            const countLabel = document.getElementById('movie-count');
            
            if (typeof movieData === 'undefined' || !movieData.length) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-neutral-600 italic">SYSTEM_ERROR: ARCHIVE_EMPTY</div>`;
                return;
            }

            countLabel.innerText = `DATA_SYNC: ${movieData.length} RECORDS_FOUND`;

            // Hero Slider
            const featured = movieData.filter(m => m.isFeatured);
            heroContainer.innerHTML = (featured.length ? featured : movieData).map((movie, index) => `
                <div class="slide ${index === 0 ? 'active' : ''}" style="background-image: url('${movie.posterLandscape}');">
                    <div class="hero-content">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="w-8 h-[1px] bg-red-600"></span>
                            <span class="text-red-500 font-bold text-[10px] tracking-[0.4em] uppercase">Zenith Prime</span>
                        </div>
                        <h1 class="text-7xl font-bold mb-6 tracking-tighter uppercase leading-[0.9]">${movie.title}</h1>
                        <p class="text-neutral-300 text-lg mb-10 max-w-lg leading-relaxed">${movie.plot}</p>
                        <button class="bg-red-600 text-white px-10 py-4 font-bold text-xs tracking-widest uppercase hover:bg-white hover:text-black transition-all" onclick="redirectToPlayer('${movie.id}')">Initiate Stream</button>
                    </div>
                </div>
            `).join('');

            // Grid
            grid.innerHTML = movieData.map(movie => `
                <div class="movie-card" onclick="showDetails('${movie.id}')">
                    <img src="${movie.posterPortrait}" alt="${movie.title}">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent p-4 flex flex-col justify-end opacity-0 hover:opacity-100 transition-opacity">
                        <h4 class="font-bold text-sm uppercase tracking-tighter">${movie.title}</h4>
                        <div class="text-[8px] text-red-500 font-bold tracking-widest uppercase mt-1">${movie.genre}</div>
                    </div>
                </div>
            `).join('');
        }

        function showDetails(id) {
            const movie = movieData.find(m => m.id === id);
            document.getElementById('modal-hero').style.backgroundImage = `url('${movie.posterLandscape}')`;
            document.getElementById('modal-title').innerText = movie.title;
            document.getElementById('modal-genre').innerText = movie.genre;
            document.getElementById('modal-plot').innerText = movie.plot;
            document.getElementById('modal-play-btn').onclick = () => redirectToPlayer(movie.id);
            document.getElementById('details-modal').style.display = 'flex';
        }

        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; }
        function redirectToPlayer(id) { window.location.href = `video_player.html?id=${id}`; }
    </script>
</body>
</html>
