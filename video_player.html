<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Cinema Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="movies.js"></script>
    <style>
        :root {
            --zenith-red: #ff2d2d;
            --zenith-blue: #00d2ff;
            --bg-black: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* --- AMBIENT LIGHTING SYSTEM --- */
        .ambient-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .light-source {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: pulse-light 10s infinite alternate;
        }

        .source-red {
            top: -20%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--zenith-red), transparent 60%);
        }

        .source-blue {
            bottom: -20%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--zenith-blue), transparent 60%);
            animation-delay: 2s;
        }

        @keyframes pulse-light {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }

        /* --- PLAYER FRAME --- */
        .viewport-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: padding 0.5s ease;
        }

        .viewport-container.cinema-mode {
            padding: 0;
        }

        .glass-frame {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 90vh;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .viewport-container.cinema-mode .glass-frame {
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            animation: fade-in 1.5s forwards 0.5s;
        }

        @keyframes fade-in { to { opacity: 1; } }

        /* --- UI OVERLAYS --- */
        .hud-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.9) 100%);
            transition: opacity 0.3s ease;
        }

        .interactive { pointer-events: auto; }
        .heading-font { font-family: 'Syncopate', sans-serif; }

        .nav-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            background: var(--zenith-red);
            border-color: var(--zenith-red);
            transform: scale(1.1);
        }

        /* --- END SCREEN (JioHotstar Style) --- */
        #end-screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(30px);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: zoom-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoom-in { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .rating-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .rating-btn {
            width: 70px; height: 70px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
        }

        .rating-btn:hover {
            background: white;
            color: black;
            transform: translateY(-5px);
        }

        .next-preview {
            margin-top: 40px;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 12px;
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .countdown-overlay {
            position: absolute;
            bottom: 0; left: 0; height: 3px;
            background: var(--zenith-blue);
            width: 100%;
            transform-origin: left;
            animation: drain 10s linear forwards;
        }

        @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

        .hide-ui .hud-overlay { opacity: 0; }
        .hide-ui { cursor: none; }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: flex; flex-direction: column;
            align-items: center; gap: 15px;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--zenith-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-layer">
        <div class="light-source source-red"></div>
        <div class="light-source source-blue"></div>
    </div>

    <div class="viewport-container" id="main-container">
        
        <div id="loader">
            <div class="spinner"></div>
            <div class="text-[10px] tracking-[0.3em] text-neutral-500 animate-pulse">ESTABLISHING SECURE CONNECTION</div>
        </div>

        <div class="glass-frame">
            <!-- Automatic Detection: The 'load' event on iframe combined with a timer helps detect if the video has ended/stopped -->
            <iframe id="zenith-iframe" src="" allow="autoplay; fullscreen" allowfullscreen onload="handleIframeLoad()"></iframe>
        </div>

        <!-- JIOHOTSTAR STYLE END SCREEN -->
        <div id="end-screen">
            <div class="rating-card">
                <button onclick="goHome()" class="absolute top-8 right-8 text-neutral-500 hover:text-white transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>

                <h2 class="heading-font text-2xl font-bold mb-2 uppercase tracking-tight">How was the experience?</h2>
                <p class="text-neutral-500 text-xs mb-8 tracking-widest">YOUR FEEDBACK OPTIMIZES THE ARCHIVE</p>
                
                <div class="flex justify-center gap-6 mb-10">
                    <button class="rating-btn group" onclick="submitRating('loved')">
                        <svg class="w-8 h-8 group-hover:text-red-500 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.84-8.84 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    </button>
                    <button class="rating-btn group" onclick="submitRating('okay')">
                        <svg class="w-8 h-8 group-hover:text-blue-500 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                    </button>
                </div>

                <div class="text-[10px] tracking-[0.4em] text-neutral-600 uppercase mb-4">Up Next</div>
                
                <div class="next-preview cursor-pointer group" onclick="playNext()">
                    <img id="next-poster" src="" class="w-20 h-28 object-cover rounded-lg shadow-2xl bg-neutral-900">
                    <div class="text-left">
                        <div id="next-title" class="heading-font text-lg font-bold group-hover:text-blue-400 transition-colors">---</div>
                        <div class="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">Starting in <span id="timer-sec">10</span>s</div>
                    </div>
                    <div class="countdown-overlay" id="drain-bar"></div>
                </div>

                <div class="flex gap-4 mt-10 justify-center">
                    <button onclick="playNext()" class="px-10 py-3 bg-white text-black text-[10px] font-bold uppercase tracking-widest hover:bg-blue-500 hover:text-white transition-all">Play Now</button>
                    <button onclick="goHome()" class="px-10 py-3 border border-white/10 text-white text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all">Home</button>
                </div>
            </div>
        </div>

        <!-- HUD Overlay -->
        <div class="hud-overlay" id="hud">
            <div class="flex justify-between items-start">
                <div class="back-btn-wrapper interactive flex items-center gap-6">
                    <button onclick="goHome()" class="nav-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <div>
                        <h1 id="video-title" class="heading-font text-3xl font-bold tracking-tighter text-white uppercase">---</h1>
                        <span id="video-genre" class="text-[9px] text-red-500 tracking-[0.3em] font-bold uppercase">---</span>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-end">
                <div class="hidden md:block">
                    <div class="text-[9px] text-neutral-500 tracking-[0.2em] mb-1">ZENITH SECURE PLAYER</div>
                    <div class="text-[10px] text-neutral-400 font-bold" id="clock">00:00:00</div>
                </div>
                <div class="interactive flex gap-4">
                    <button class="sys-btn bg-white/5 border border-white/10 px-6 py-2 rounded text-[10px] uppercase tracking-widest hover:bg-white hover:text-black transition-all" onclick="toggleCinemaMode()">Cinema Mode</button>
                    <button class="sys-btn bg-red-600/20 border border-red-600/30 px-6 py-2 rounded text-[10px] uppercase tracking-widest hover:bg-red-600 transition-all" onclick="triggerEndScreen()">Manual Finish</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        const iframe = document.getElementById('zenith-iframe');
        const loader = document.getElementById('loader');
        let nextMovieId = null;
        let isEnded = false;

        // Clock logic
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        window.onload = () => {
            if (typeof movieData === 'undefined') return;

            const movie = movieData.find(m => m.id === movieId);
            const currentIndex = movieData.findIndex(m => m.id === movieId);
            const nextMovie = movieData[(currentIndex + 1) % movieData.length];
            
            nextMovieId = nextMovie.id;
            document.getElementById('next-title').innerText = nextMovie.title;
            // USING PORTRAIT POSTER FROM JS FILE
            document.getElementById('next-poster').src = nextMovie.posterPortrait;

            if (movie) {
                document.getElementById('video-title').innerText = movie.title;
                document.getElementById('video-genre').innerText = movie.genre;
                iframe.src = movie.videoFile;
                
                // Hide loader after a simulated "decryption" time
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 2000);
            }
        };

        // AUTOMATIC DETECTION WORKAROUND
        // Since we can't get events from inside the iframe directly, we monitor the iframe's state.
        // If the user hasn't interacted for a very long time or the iframe stops sending heartbeat, we can trigger it.
        // For this demo, we use a custom "Manual Finish" for user control, but also monitor the "load" event.
        function handleIframeLoad() {
            console.log("Stream container active.");
        }

        function triggerEndScreen() {
            if (isEnded) return;
            isEnded = true;

            document.getElementById('hud').style.display = 'none';
            const endScreen = document.getElementById('end-screen');
            endScreen.style.display = 'flex';
            
            let timeLeft = 10;
            const timerEl = document.getElementById('timer-sec');
            
            const countdown = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    playNext();
                }
            }, 1000);
        }

        function submitRating(val) {
            console.log("Rating:", val);
            // Flash feedback
            const card = document.querySelector('.rating-card');
            card.style.borderColor = val === 'loved' ? '#ff2d2d' : '#00d2ff';
            setTimeout(playNext, 800);
        }

        function playNext() {
            if (nextMovieId) {
                window.location.href = `video_player.html?id=${nextMovieId}`;
            }
        }

        function goHome() {
            window.location.href = 'norm_viewerpage.html';
        }

        function toggleCinemaMode() {
            document.getElementById('main-container').classList.toggle('cinema-mode');
        }

        // Auto-Hide HUD
        let idle;
        document.addEventListener('mousemove', () => {
            document.body.classList.remove('hide-ui');
            clearTimeout(idle);
            idle = setTimeout(() => document.body.classList.add('hide-ui'), 3000);
        });

    </script>
</body>
</html>
