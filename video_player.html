<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Cinema Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="movies.js"></script>
    <style>
        :root { --accent: #ff2d2d; --bg: #050505; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .viewport { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; z-index: 1; }
        
        .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); pointer-events: none; z-index: 10; transition: opacity 0.5s; }
        .interactive { pointer-events: auto; }
        .hide-ui .hud { opacity: 0; }
        .hide-ui { cursor: none; }

        #save-status { position: fixed; bottom: 30px; left: 40px; font-size: 9px; color: #444; text-transform: uppercase; letter-spacing: 3px; font-weight: bold; z-index: 10; }
    </style>
</head>
<body>

    <div class="viewport" id="stage">
        <div class="hud" id="hud">
            <div class="flex items-center gap-8">
                <!-- Smart Exit Button -->
                <button onclick="smartExit()" class="interactive w-12 h-12 rounded-full border border-white/10 flex items-center justify-center hover:bg-white hover:text-black transition-all">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div>
                    <h1 id="v-title" class="text-3xl font-bold uppercase tracking-tighter">---</h1>
                    <span id="sync-label" class="text-[9px] text-red-500 font-bold uppercase tracking-[0.4em]">Vault Sync Active</span>
                </div>
            </div>
        </div>

        <iframe id="cinema-frame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
        
        <div id="save-status">Initializing Data Sync...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        const originPage = params.get('origin'); 
        let playhead = 0;

        // Function to ensure Google Drive links are in "Preview" mode
        function cleanDriveUrl(url) {
            if (!url) return "";
            if (url.includes('drive.google.com')) {
                let id = "";
                const matchFile = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (matchFile && matchFile[1]) id = matchFile[1];
                if (!id) {
                    const matchIdParam = url.match(/id=([a-zA-Z0-9_-]+)/);
                    if (matchIdParam && matchIdParam[1]) id = matchIdParam[1];
                }
                if (id) return `https://drive.google.com/file/d/${id}/preview`;
            }
            return url;
        }

        window.onload = () => {
            const movie = movieData.find(m => m.id === movieId);
            if (!movie) return smartExit();

            document.getElementById('v-title').innerText = movie.title;
            
            // Apply URL cleaning logic
            const embedUrl = cleanDriveUrl(movie.videoFile);
            document.getElementById('cinema-frame').src = embedUrl;

            // Only show "Vault Sync" if user is logged in
            const hasUser = localStorage.getItem('zenith_session_user');
            if (!hasUser) {
                document.getElementById('sync-label').innerText = "Guest Mode Active";
                document.getElementById('sync-label').classList.replace('text-red-500', 'text-neutral-500');
                document.getElementById('save-status').style.display = 'none';
            }

            setInterval(() => {
                playhead += 1;
                if (hasUser) updateVault(movieId, playhead);
            }, 5000); // Sync every 5 seconds to save resources
        };

        function updateVault(id, time) {
            const hist = JSON.parse(localStorage.getItem('zenith_history') || '{}');
            hist[id] = time;
            localStorage.setItem('zenith_history', JSON.stringify(hist));
            
            const status = document.getElementById('save-status');
            status.innerText = "Vault Synchronized";
            setTimeout(() => { status.innerText = "Monitoring Session"; }, 800);
        }

        function smartExit() {
            const hasUser = localStorage.getItem('zenith_session_user');
            
            // If the user is logged in, always go to the portal
            if (hasUser) {
                window.location.href = 'norm_viewerpage.html';
                return;
            }
            
            // If not logged in, go to the public home page
            window.location.href = 'index.html';
        }

        // HUD Visibility Logic
        let idle;
        document.addEventListener('mousemove', () => {
            document.body.classList.remove('hide-ui');
            clearTimeout(idle);
            idle = setTimeout(() => document.body.classList.add('hide-ui'), 3000);
        });
    </script>
</body>
</html>
