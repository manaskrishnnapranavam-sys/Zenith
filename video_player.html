<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Cinema Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="movies.js"></script>
    <style>
        :root {
            --zenith-red: #ff2d2d;
            --zenith-blue: #00d2ff;
            --bg-black: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* --- AMBIENT LIGHTING SYSTEM --- */
        .ambient-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .light-source {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: pulse-light 10s infinite alternate;
        }

        .source-red {
            top: -20%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--zenith-red), transparent 60%);
        }

        .source-blue {
            bottom: -20%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--zenith-blue), transparent 60%);
            animation-delay: 2s;
        }

        @keyframes pulse-light {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }

        /* --- PLAYER FRAME (The Monitor) --- */
        .viewport-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; /* Space for the "frame" look */
            transition: padding 0.5s ease;
        }

        .viewport-container.cinema-mode {
            padding: 0;
        }

        .glass-frame {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px; /* Constrain slightly for aesthetic */
            max-height: 90vh;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .viewport-container.cinema-mode .glass-frame {
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            animation: fade-in 1.5s forwards 0.5s;
        }

        @keyframes fade-in { to { opacity: 1; } }

        /* --- UI OVERLAYS --- */
        .hud-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.9) 100%);
            transition: opacity 0.3s ease;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Header Elements */
        .heading-font { font-family: 'Syncopate', sans-serif; }

        .back-btn-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            background: var(--zenith-red);
            border-color: var(--zenith-red);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 45, 45, 0.4);
        }

        /* Bottom Control Deck */
        .control-deck {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .status-badge {
            font-size: 10px;
            color: var(--zenith-blue);
            background: rgba(0, 210, 255, 0.1);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            letter-spacing: 2px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .action-bar {
            display: flex;
            gap: 15px;
        }

        .sys-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sys-btn:hover {
            background: white;
            color: black;
        }

        .sys-btn svg { width: 14px; height: 14px; }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--zenith-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Hiding UI */
        .hide-ui .hud-overlay { opacity: 0; }
        .hide-ui { cursor: none; }

    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-layer">
        <div class="light-source source-red"></div>
        <div class="light-source source-blue"></div>
    </div>

    <!-- Main Viewport -->
    <div class="viewport-container" id="main-container">
        
        <!-- Loading State -->
        <div id="loader">
            <div class="spinner"></div>
            <div class="text-[10px] tracking-[0.3em] text-neutral-500 animate-pulse">DECRYPTING STREAM</div>
        </div>

        <!-- The "Screen" -->
        <div class="glass-frame">
            <iframe id="zenith-iframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <!-- Heads Up Display (HUD) -->
        <div class="hud-overlay" id="hud">
            
            <!-- Top Bar -->
            <div class="flex justify-between items-start">
                <div class="back-btn-wrapper interactive">
                    <button onclick="window.history.back()" class="nav-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <div>
                        <h1 id="video-title" class="heading-font text-3xl font-bold tracking-tighter text-white uppercase drop-shadow-lg">---</h1>
                        <div class="flex items-center gap-3">
                            <span id="video-genre" class="text-[9px] text-red-500 tracking-[0.2em] font-bold uppercase">---</span>
                            <span class="w-1 h-1 bg-neutral-600 rounded-full"></span>
                            <span class="text-[9px] text-neutral-400 tracking-widest">SECURE LINK</span>
                        </div>
                    </div>
                </div>
                
                <div class="text-right hidden md:block">
                    <div class="text-[9px] text-neutral-500 tracking-[0.2em]">ZENITH OS v4.2</div>
                    <div class="text-[9px] text-neutral-600 tracking-widest mt-1" id="clock">00:00:00</div>
                </div>
            </div>

            <!-- Bottom Deck -->
            <div class="control-deck">
                <div class="hidden md:block">
                    <div class="status-badge">STREAM OPTIMIZED</div>
                    <p class="text-[9px] text-neutral-600 mt-1 max-w-[200px]">Use internal controls for playback. System wrappers active.</p>
                </div>

                <div class="action-bar interactive">
                    <button class="sys-btn" onclick="toggleCinemaMode()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                        Cinema Mode
                    </button>
                    <button class="sys-btn" onclick="reloadFrame()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/></svg>
                        Reload
                    </button>
                    <button class="sys-btn" onclick="copyLink()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                        Share
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        const iframe = document.getElementById('zenith-iframe');
        const loader = document.getElementById('loader');
        const container = document.getElementById('main-container');

        // Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);

        window.onload = () => {
            if (typeof movieData === 'undefined') {
                alert("Database Error: movies.js not found");
                return;
            }

            const movie = movieData.find(m => m.id === movieId);
            
            if (movie) {
                document.getElementById('video-title').innerText = movie.title;
                document.getElementById('video-genre').innerText = movie.genre;
                
                // Set source
                iframe.src = movie.videoFile;
                
                // Simulate buffering "Decrypting" phase
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 2500);
            } else {
                document.getElementById('video-title').innerText = "ASSET NOT FOUND";
                loader.style.display = 'none';
            }
        };

        // --- FEATURES ---

        // 1. Cinema Mode: Removes padding and hides non-essential UI to focus on the iframe
        function toggleCinemaMode() {
            container.classList.toggle('cinema-mode');
            const hud = document.getElementById('hud');
            
            // Optional: Dim ambient light in cinema mode
            document.querySelector('.ambient-layer').style.opacity = 
                container.classList.contains('cinema-mode') ? '0.1' : '1';
        }

        // 2. Reload: Helpful for iframe glitches
        function reloadFrame() {
            iframe.src = iframe.src;
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 1500);
        }

        // 3. Copy Link
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("SECURE LINK COPIED TO CLIPBOARD");
        }

        // 4. Auto-Hide UI Logic
        let idleTimer;
        document.addEventListener('mousemove', () => {
            document.body.classList.remove('hide-ui');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                // Only hide if we haven't clicked anything recently
                document.body.classList.add('hide-ui');
            }, 3500);
        });

    </script>
</body>
</html>
