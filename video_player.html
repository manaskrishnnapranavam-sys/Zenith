<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Cinema Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="movies.js"></script>
    <style>
        :root {
            --zenith-red: #ff2d2d;
            --zenith-blue: #00d2ff;
            --bg-black: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* --- AMBIENT LIGHTING SYSTEM --- */
        .ambient-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .light-source {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: pulse-light 10s infinite alternate;
        }

        .source-red {
            top: -20%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--zenith-red), transparent 60%);
        }

        .source-blue {
            bottom: -20%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--zenith-blue), transparent 60%);
            animation-delay: 2s;
        }

        @keyframes pulse-light {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }

        /* --- PLAYER FRAME (The Monitor) --- */
        .viewport-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: padding 0.5s ease;
        }

        .viewport-container.cinema-mode {
            padding: 0;
        }

        .glass-frame {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 90vh;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .viewport-container.cinema-mode .glass-frame {
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            animation: fade-in 1.5s forwards 0.5s;
        }

        @keyframes fade-in { to { opacity: 1; } }

        /* --- UI OVERLAYS --- */
        .hud-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.9) 100%);
            transition: opacity 0.3s ease;
        }

        .interactive { pointer-events: auto; }

        /* Header Elements */
        .heading-font { font-family: 'Syncopate', sans-serif; }

        .back-btn-wrapper { display: flex; align-items: center; gap: 20px; }

        .nav-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            background: var(--zenith-red);
            border-color: var(--zenith-red);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 45, 45, 0.4);
        }

        /* Bottom Control Deck */
        .control-deck {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .status-badge {
            font-size: 10px;
            color: var(--zenith-blue);
            background: rgba(0, 210, 255, 0.1);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            letter-spacing: 2px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .action-bar { display: flex; gap: 15px; }

        .sys-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            display: flex; align-items: center; gap: 8px;
        }

        .sys-btn:hover { background: white; color: black; }
        .sys-btn.finish-btn:hover { background: var(--zenith-red); color: white; border-color: var(--zenith-red); }

        .sys-btn svg { width: 14px; height: 14px; }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: flex; flex-direction: column;
            align-items: center; gap: 15px;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--zenith-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* END SCREEN OVERLAY */
        #end-screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            z-index: 60;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fade-up 0.4s ease;
        }

        @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .rating-box {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .rate-btn {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }

        .rate-btn:hover { transform: scale(1.1); background: white; color: black; }
        .rate-btn svg { width: 24px; height: 24px; }

        .next-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            width: 100%; max-width: 400px;
            display: flex; gap: 20px; align-items: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .next-card:hover { border-color: var(--zenith-blue); background: rgba(255,255,255,0.08); }

        .progress-line {
            position: absolute; bottom: 0; left: 0; height: 3px; background: var(--zenith-blue);
            width: 0%; transition: width 10s linear;
        }

        .hide-ui .hud-overlay { opacity: 0; }
        .hide-ui { cursor: none; }

    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-layer">
        <div class="light-source source-red"></div>
        <div class="light-source source-blue"></div>
    </div>

    <!-- Main Viewport -->
    <div class="viewport-container" id="main-container">
        
        <!-- Loading State -->
        <div id="loader">
            <div class="spinner"></div>
            <div class="text-[10px] tracking-[0.3em] text-neutral-500 animate-pulse">DECRYPTING STREAM</div>
        </div>

        <!-- The "Screen" -->
        <div class="glass-frame">
            <iframe id="zenith-iframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <!-- END SCREEN (Up Next / Rating) -->
        <div id="end-screen">
            <!-- Close / Return to Home Button -->
            <button onclick="goHome()" class="absolute top-10 right-10 flex items-center gap-2 text-neutral-500 hover:text-white transition-colors group">
                <span class="text-[10px] font-bold uppercase tracking-widest group-hover:text-red-500 transition-colors">Return to Base</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>

            <h2 class="heading-font text-2xl font-bold mb-8">DID YOU LIKE THIS?</h2>
            
            <div class="rating-box">
                <button class="rate-btn" onclick="submitRating('like')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                </button>
                <button class="rate-btn" onclick="submitRating('dislike')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>
                </button>
            </div>

            <div class="text-[10px] tracking-[0.3em] text-neutral-500 mb-4 uppercase">Up Next In Queue</div>
            
            <div class="next-card" onclick="playNext()">
                <!-- Fetches the Portrait Poster from JS -->
                <img id="next-poster" src="" class="w-16 h-24 object-cover rounded bg-neutral-800">
                <div>
                    <div class="text-[9px] text-blue-400 font-bold tracking-widest uppercase mb-1">Coming Up</div>
                    <div id="next-title" class="heading-font text-lg font-bold leading-tight">---</div>
                </div>
                <div class="progress-line" id="auto-play-timer"></div>
            </div>
            
            <div class="flex gap-4 mt-8">
                <button onclick="playNext()" class="px-8 py-3 bg-white text-black text-xs font-bold uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all">Play Now</button>
                <button onclick="goHome()" class="px-8 py-3 border border-white/20 text-white text-xs font-bold uppercase tracking-widest hover:bg-white hover:text-black transition-all">Home Screen</button>
            </div>
        </div>

        <!-- Heads Up Display (HUD) -->
        <div class="hud-overlay" id="hud">
            
            <!-- Top Bar -->
            <div class="flex justify-between items-start">
                <div class="back-btn-wrapper interactive">
                    <button onclick="window.history.back()" class="nav-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <div>
                        <h1 id="video-title" class="heading-font text-3xl font-bold tracking-tighter text-white uppercase drop-shadow-lg">---</h1>
                        <div class="flex items-center gap-3">
                            <span id="video-genre" class="text-[9px] text-red-500 tracking-[0.2em] font-bold uppercase">---</span>
                        </div>
                    </div>
                </div>
                
                <div class="text-right hidden md:block">
                    <div class="text-[9px] text-neutral-500 tracking-[0.2em]">ZENITH OS v4.2</div>
                    <div class="text-[9px] text-neutral-600 tracking-widest mt-1" id="clock">00:00:00</div>
                </div>
            </div>

            <!-- Bottom Deck -->
            <div class="control-deck">
                <div class="hidden md:block">
                    <div class="status-badge">GOOGLE DRIVE PROXY</div>
                    <p class="text-[9px] text-neutral-600 mt-1 max-w-[200px]">External controls restricted. Use "Finish" to log watch data.</p>
                </div>

                <div class="action-bar interactive">
                    <button class="sys-btn" onclick="toggleCinemaMode()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                        Focus
                    </button>
                    <button class="sys-btn" onclick="reloadFrame()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/></svg>
                        Refresh
                    </button>
                    <button class="sys-btn finish-btn" onclick="triggerEndScreen()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        FINISH STREAM
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        const iframe = document.getElementById('zenith-iframe');
        const loader = document.getElementById('loader');
        const container = document.getElementById('main-container');
        let nextMovieId = null;

        // Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);

        window.onload = () => {
            if (typeof movieData === 'undefined') return alert("Database Error");

            const movie = movieData.find(m => m.id === movieId);
            const currentIndex = movieData.findIndex(m => m.id === movieId);
            
            // Calculate Next Movie
            const nextIndex = (currentIndex + 1) % movieData.length;
            const nextMovie = movieData[nextIndex];
            nextMovieId = nextMovie.id;

            // Setup Next Movie UI
            document.getElementById('next-title').innerText = nextMovie.title;
            // Ensures we use the Portrait Poster from the database
            document.getElementById('next-poster').src = nextMovie.posterPortrait;

            if (movie) {
                document.getElementById('video-title').innerText = movie.title;
                document.getElementById('video-genre').innerText = movie.genre;
                iframe.src = movie.videoFile;
                
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 2500);
            }
        };

        // --- FEATURES ---

        function toggleCinemaMode() {
            container.classList.toggle('cinema-mode');
            document.querySelector('.ambient-layer').style.opacity = 
                container.classList.contains('cinema-mode') ? '0.1' : '1';
        }

        function reloadFrame() {
            iframe.src = iframe.src;
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 1500);
        }

        function triggerEndScreen() {
            // Hide the HUD and show End Screen
            document.getElementById('hud').style.display = 'none';
            document.getElementById('end-screen').style.display = 'flex';
            
            // Start Progress Bar for Auto Play
            setTimeout(() => {
                document.getElementById('auto-play-timer').style.width = '100%';
            }, 100);

            // Auto Redirect after 10s
            setTimeout(() => {
                playNext();
            }, 10000);
        }

        function submitRating(type) {
            // Simulate saving rating
            console.log(`User rated ${movieId}: ${type}`);
            
            // Flash button color
            const btn = event.currentTarget;
            btn.style.background = type === 'like' ? '#00ff00' : '#ff0000';
            btn.style.color = 'black';
            
            // Go to next immediately
            setTimeout(playNext, 500);
        }

        function playNext() {
            if (nextMovieId) {
                window.location.href = `video_player.html?id=${nextMovieId}`;
            }
        }

        function goHome() {
            // Smart Redirect: If logged in, go to portal. If not, go to home.
            if (localStorage.getItem('zenith_session_user')) {
                window.location.href = 'norm_viewerpage.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        // Auto-Hide UI Logic
        let idleTimer;
        document.addEventListener('mousemove', () => {
            document.body.classList.remove('hide-ui');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                document.body.classList.add('hide-ui');
            }, 3500);
        });

    </script>
</body>
</html>
