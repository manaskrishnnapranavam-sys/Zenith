<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Cinema Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="movies.js"></script>
    <style>
        :root {
            --zenith-red: #ff2d2d;
            --zenith-blue: #00d2ff;
            --bg-black: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: black;
        }

        /* High-End Iframe Container */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Ambient Glow Accents */
        .ambient-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            opacity: 0.6;
        }

        .glow-red {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(255, 45, 45, 0.15) 0%, transparent 70%);
            filter: blur(100px);
        }

        .glow-blue {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.1) 0%, transparent 70%);
            filter: blur(100px);
        }

        /* UI Overlays */
        .ui-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 30%);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .player-wrapper:hover .ui-overlay {
            opacity: 1;
        }

        .heading-font { font-family: 'Syncopate', sans-serif; }

        .back-btn {
            pointer-events: auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--zenith-red);
            transform: scale(1.1);
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--zenith-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="player-wrapper" id="player-container">
        <div id="loader"></div>
        
        <div class="ambient-glow">
            <div class="glow-red"></div>
            <div class="glow-blue"></div>
        </div>

        <!-- The Iframe Player -->
        <div class="iframe-container">
            <iframe id="zenith-iframe" 
                    src="" 
                    allow="autoplay; fullscreen" 
                    allowfullscreen>
            </iframe>
        </div>

        <!-- UI Overlay (Minimalist for Iframe) -->
        <div class="ui-overlay" id="ui-overlay">
            <div class="flex justify-between items-start">
                <div class="flex items-center gap-6">
                    <button onclick="window.history.back()" class="back-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <div>
                        <h1 id="video-title" class="heading-font text-2xl font-bold tracking-tighter uppercase text-white">Initializing...</h1>
                        <p id="video-genre" class="text-[10px] text-red-500 tracking-[0.4em] font-bold mt-1 uppercase"></p>
                    </div>
                </div>
                <div class="text-right">
                    <div class="heading-font text-[9px] text-neutral-500 tracking-widest">ZENITH SECURE STREAM</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        const iframe = document.getElementById('zenith-iframe');
        const loader = document.getElementById('loader');

        window.onload = () => {
            const movie = movieData.find(m => m.id === movieId);
            
            if (movie) {
                document.getElementById('video-title').innerText = movie.title;
                document.getElementById('video-genre').innerText = movie.genre;
                
                // Set the iframe source
                iframe.src = movie.videoFile;
                
                // Hide loader after a bit (iframes don't have a reliable 'load' for drive previews)
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 2000);
            } else {
                document.getElementById('video-title').innerText = "ASSET NOT FOUND";
                loader.style.display = 'none';
            }
        };

        // UI Auto-hide
        let idleTimer;
        const overlay = document.getElementById('ui-overlay');
        document.addEventListener('mousemove', () => {
            overlay.style.opacity = '1';
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                overlay.style.opacity = '0';
            }, 3000);
        });
    </script>
</body>
</html>
