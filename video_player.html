<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Cinema Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="movies.js"></script>
    <style>
        :root {
            --zenith-red: #ff2d2d;
            --zenith-blue: #00d2ff;
            --bg-black: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
            cursor: none;
        }

        .player-container.show-cursor {
            cursor: default;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ambient-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            transition: opacity 1s;
        }

        .glow-red {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(255, 45, 45, 0.15) 0%, transparent 70%);
            filter: blur(80px);
        }

        .glow-blue {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.1) 0%, transparent 70%);
            filter: blur(80px);
        }

        .ui-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.8) 100%);
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-container:hover .ui-overlay {
            opacity: 1;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
        }

        .heading-font { font-family: 'Syncopate', sans-serif; }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 25px;
            transition: height 0.2s;
        }

        .progress-container:hover { height: 10px; }

        .progress-bar {
            height: 100%;
            background: var(--zenith-red);
            width: 0%;
            border-radius: 3px;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 45, 45, 0.5);
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--zenith-red);
        }

        .volume-slider {
            width: 80px;
            accent-color: var(--zenith-red);
            cursor: pointer;
        }

        #loader {
            position: absolute;
            z-index: 50;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--zenith-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="player-container" id="player-container">
        <div id="loader"></div>
        
        <div class="ambient-glow">
            <div class="glow-red"></div>
            <div class="glow-blue"></div>
        </div>

        <video id="main-video" playsinline></video>

        <div class="ui-overlay" id="ui-overlay">
            <div class="flex justify-between items-start">
                <div>
                    <button onclick="window.history.back()" class="control-btn mb-4">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <h1 id="video-title" class="heading-font text-2xl font-bold tracking-tighter uppercase">Initializing...</h1>
                    <p id="video-genre" class="text-xs text-red-500 tracking-[0.3em] font-bold mt-1 uppercase"></p>
                </div>
                <div class="text-right">
                    <div class="heading-font text-[10px] text-neutral-500 tracking-widest">ZENITH STREAM v2.0</div>
                </div>
            </div>

            <div class="w-full">
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>

                <div class="glass-panel controls-row">
                    <div class="flex items-center gap-6">
                        <button class="control-btn" onclick="togglePlay()" id="play-btn">
                            <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        
                        <div class="flex items-center gap-3">
                            <button class="control-btn" onclick="toggleMute()">
                                <svg id="mute-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
                            </button>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="1">
                        </div>

                        <div class="text-[11px] font-mono tracking-widest">
                            <span id="current-time">00:00</span> / <span id="duration-time">00:00</span>
                        </div>
                    </div>

                    <button class="control-btn" onclick="toggleFullscreen()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('main-video');
        const playIcon = document.getElementById('play-icon');
        const progress = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const volSlider = document.getElementById('volume-slider');
        const loader = document.getElementById('loader');
        const container = document.getElementById('player-container');
        
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        window.onload = () => {
            const movie = movieData.find(m => m.id === movieId);
            
            if (movie) {
                document.getElementById('video-title').innerText = movie.title;
                document.getElementById('video-genre').innerText = movie.genre;
                video.poster = movie.posterLandscape || '';
                
                // Set the video source directly from the database entry
                video.src = movie.videoFile;
                video.load();
            } else {
                document.getElementById('video-title').innerText = "ASSET NOT FOUND";
                loader.style.display = 'none';
            }
        };

        function togglePlay() {
            if (video.paused) {
                video.play();
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                video.pause();
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                progress.style.width = `${percent}%`;
                document.getElementById('current-time').innerText = formatTime(video.currentTime);
            }
        });

        video.addEventListener('loadedmetadata', () => {
            document.getElementById('duration-time').innerText = formatTime(video.duration);
            loader.style.display = 'none';
        });

        video.addEventListener('waiting', () => loader.style.display = 'block');
        video.addEventListener('playing', () => loader.style.display = 'none');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        progressContainer.addEventListener('click', (e) => {
            const pos = (e.pageX - progressContainer.offsetLeft) / progressContainer.offsetWidth;
            video.currentTime = pos * video.duration;
        });

        volSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                container.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Mouse behavior
        let idleTimer;
        container.addEventListener('mousemove', () => {
            container.classList.add('show-cursor');
            document.getElementById('ui-overlay').style.opacity = '1';
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!video.paused) {
                    container.classList.remove('show-cursor');
                    document.getElementById('ui-overlay').style.opacity = '0';
                }
            }, 3000);
        });
    </script>
</body>
</html>
