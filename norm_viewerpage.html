<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH | Viewer Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <script src="movies.js"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #ff2d2d;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .heading-font { font-family: 'Syncopate', sans-serif; }

        .profile-hex {
            width: 120px;
            height: 120px;
            background: #111;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 300;
            color: white;
            position: relative;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            transition: all 0.3s;
        }

        .profile-hex:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(255, 45, 45, 0.2);
        }

        .glass-card {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            border-radius: 4px;
        }

        .input-zenith {
            background: transparent;
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
            width: 100%;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-zenith:focus {
            border-color: var(--accent);
        }

        /* --- PORTRAIT CARD SYSTEM --- */
        .movie-card {
            background: #0a0a0a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }

        /* Aspect Ratio 2:3 for Portrait */
        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 150%; 
            overflow: hidden;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .movie-card:hover {
            transform: scale(1.05);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(255, 45, 45, 0.15);
        }

        .movie-card .overlay-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .movie-card:hover .overlay-info {
            opacity: 1;
        }

        .sidebar-link {
            padding: 15px 0;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .sidebar-link:hover, .sidebar-link.active {
            color: white;
            padding-left: 10px;
        }

        .sidebar-link.active::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        #details-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 px-12 py-6 flex justify-between items-center bg-black/50 backdrop-blur-md border-b border-white/5">
        <div class="heading-font text-xl font-bold tracking-tighter cursor-pointer" onclick="location.href='index.html'">ZENITH</div>
        <div class="flex items-center gap-6">
            <span id="nav-user-display" class="text-[10px] tracking-widest text-neutral-400">SESSION: <span class="text-white">GUEST</span></span>
            <button onclick="logout()" class="text-[10px] tracking-widest text-neutral-500 hover:text-red-500 uppercase transition-colors">Terminate Session</button>
        </div>
    </nav>

    <div class="flex pt-24 min-h-screen">
        <aside class="w-72 px-12 py-10 border-r border-white/5 fixed h-full bg-black">
            <div class="sidebar-link active" onclick="showSection('home')">Vault Dashboard</div>
            <div class="sidebar-link" onclick="showSection('overview')">Profile Overview</div>
            <div class="sidebar-link" onclick="showSection('edit-profile')">Identity Core</div>
            <div class="sidebar-link" onclick="showSection('history')">Watch History</div>
            <div class="mt-20">
                <div class="text-[9px] text-neutral-600 tracking-widest mb-4 uppercase">System Control</div>
                <div class="sidebar-link" onclick="logout()">Exit Portal</div>
            </div>
        </aside>

        <main class="flex-1 ml-72 p-16">
            
            <div id="home-section" class="section-content">
                <div class="mb-12">
                    <h1 class="text-4xl font-bold tracking-tighter mb-2">VAULT DASHBOARD</h1>
                    <p class="text-neutral-500 text-sm">Welcome back, <span id="home-name" class="text-white font-semibold"></span> Explore the latest encrypted releases.</p>
                </div>
                <!-- Changed to portrait layout -->
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="vault-grid"></div>
            </div>

            <div id="overview-section" class="section-content hidden">
                <div class="flex items-center gap-10 mb-20">
                    <div class="profile-hex" id="user-avatar-hex">?</div>
                    <div>
                        <h1 id="welcome-name" class="text-5xl font-bold tracking-tighter mb-2"></h1>
                        <p id="user-status" class="text-neutral-500 text-xs tracking-widest uppercase border-l-2 border-red-600 pl-4">Authorized Viewer</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-10">
                    <div class="glass-card p-8 border-l-2 border-red-600">
                        <h3 class="text-[10px] uppercase tracking-widest text-neutral-500 mb-6">Security Clearance</h3>
                        <div id="activity-list" class="space-y-4"></div>
                    </div>
                    <div class="glass-card p-8">
                        <h3 class="text-[10px] uppercase tracking-widest text-neutral-500 mb-6">User Telemetry</h3>
                        <div class="space-y-4 text-sm">
                            <div class="flex justify-between border-b border-white/5 pb-2">
                                <span class="text-neutral-500">Gender Identity</span>
                                <span id="display-gender" class="text-white"></span>
                            </div>
                            <div class="flex justify-between border-b border-white/5 pb-2">
                                <span class="text-neutral-500">Age Bracket</span>
                                <span id="display-age" class="text-white"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="edit-profile-section" class="section-content hidden">
                <h1 class="text-3xl font-bold mb-10 tracking-tighter uppercase">Identity Core</h1>
                <div class="max-w-xl glass-card p-10 border-t-2 border-red-600">
                    <div class="space-y-8">
                        <div class="grid grid-cols-2 gap-8">
                            <div>
                                <label class="text-[10px] uppercase text-neutral-500">Display Name</label>
                                <input type="text" id="edit-username" class="input-zenith">
                            </div>
                            <div>
                                <label class="text-[10px] uppercase text-neutral-500">Age</label>
                                <input type="number" id="edit-age" class="input-zenith">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-neutral-500">Gender Identity</label>
                            <select id="edit-gender" class="input-zenith bg-black">
                                <option value="Unspecified">Unspecified</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Non-Binary">Non-Binary</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-neutral-500">Personal Bio</label>
                            <textarea id="edit-bio" class="input-zenith h-24 resize-none" placeholder="Transmission from the viewer..."></textarea>
                        </div>
                        <button onclick="saveIdentity()" class="bg-red-600 text-white px-10 py-3 text-xs font-bold uppercase tracking-widest hover:bg-white hover:text-black transition-all shadow-lg shadow-red-600/20">Authorize Changes</button>
                    </div>
                </div>
            </div>

            <div id="history-section" class="section-content hidden">
                <h1 class="text-3xl font-bold mb-10 tracking-tighter uppercase">Watch History</h1>
                <!-- Changed to portrait layout -->
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="history-grid"></div>
            </div>

        </main>
    </div>

    <div id="details-modal" onclick="closeDetails(event)">
        <div class="w-full max-w-4xl bg-[#0a0a0a] border border-white/10 rounded-lg overflow-hidden relative" onclick="event.stopPropagation()">
            <div id="modal-hero" class="h-[400px] bg-cover bg-center relative">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/40 to-transparent"></div>
            </div>
            <div class="p-12 -mt-32 relative z-10">
                <h1 id="modal-title" class="text-5xl font-bold mb-2 uppercase tracking-tighter"></h1>
                <p id="modal-genre" class="text-red-500 text-xs tracking-widest font-bold mb-6 border-l-2 border-red-600 pl-2"></p>
                <p id="modal-plot" class="text-neutral-400 text-lg leading-relaxed mb-10"></p>
                <button id="modal-play-btn" class="bg-red-600 text-white px-12 py-4 font-bold uppercase tracking-widest text-sm hover:bg-white hover:text-black transition-all">Initiate Stream</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        window.onload = () => {
            loadUserData();
            populateGrids();
        };

        function loadUserData() {
            const loggedInName = localStorage.getItem('zenith_session_user');
            if (!loggedInName) {
                // If accessing securely without login, kick to home
                location.href = 'index.html';
                return;
            }

            const users = JSON.parse(localStorage.getItem('zenith_users') || '[]');
            currentUser = users.find(u => u.username === loggedInName);

            if (!currentUser) {
                // Fallback dummy user if DB is cleared but session remains
                currentUser = { username: loggedInName, history: [] };
            }
            
            if (!currentUser.history) currentUser.history = [];
            updateUI();
        }

        function updateUI() {
            const name = currentUser.username.toUpperCase();
            document.getElementById('welcome-name').innerText = name;
            document.getElementById('home-name').innerText = name;
            document.getElementById('nav-user-display').innerHTML = `SESSION: <span class="text-white">${name}</span>`;
            document.getElementById('user-avatar-hex').innerText = currentUser.username[0].toUpperCase();
            
            document.getElementById('display-gender').innerText = currentUser.gender || 'Unspecified';
            document.getElementById('display-age').innerText = currentUser.age || 'Unknown';

            document.getElementById('edit-username').value = currentUser.username;
            document.getElementById('edit-age').value = currentUser.age || '';
            document.getElementById('edit-gender').value = currentUser.gender || 'Unspecified';
            document.getElementById('edit-bio').value = currentUser.bio || '';

            const activity = document.getElementById('activity-list');
            activity.innerHTML = `
                <div class="flex justify-between text-[10px] py-2 border-b border-white/5">
                    <span class="text-neutral-400">IDENTITY_VERIFIED</span>
                    <span class="text-red-500">SECURE</span>
                </div>
                <div class="flex justify-between text-[10px] py-2 border-b border-white/5">
                    <span class="text-neutral-400">WATCHED_ASSETS</span>
                    <span class="text-neutral-500">${currentUser.history.length} ITEMS</span>
                </div>
            `;
            
            renderHistory();
        }

        function showSection(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            const links = Array.from(document.querySelectorAll('.sidebar-link'));
            const activeLink = links.find(link => link.onclick.toString().includes(id));
            if(activeLink) activeLink.classList.add('active');
        }

        function saveIdentity() {
            const newName = document.getElementById('edit-username').value;
            const newAge = document.getElementById('edit-age').value;
            const newGender = document.getElementById('edit-gender').value;
            const newBio = document.getElementById('edit-bio').value;

            const oldName = currentUser.username;
            currentUser.username = newName;
            currentUser.age = newAge;
            currentUser.gender = newGender;
            currentUser.bio = newBio;

            let users = JSON.parse(localStorage.getItem('zenith_users') || '[]');
            const index = users.findIndex(u => u.username === oldName);
            
            if (index !== -1) {
                users[index] = { ...users[index], ...currentUser };
            }

            localStorage.setItem('zenith_users', JSON.stringify(users));
            localStorage.setItem('zenith_session_user', newName);

            alert("IDENTITY CORE UPDATED.");
            updateUI();
            showSection('overview');
        }

        function populateGrids() {
            const vaultGrid = document.getElementById('vault-grid');
            if (typeof movieData === 'undefined' || !movieData.length) {
                vaultGrid.innerHTML = `<p class="text-neutral-600 italic">No assets detected.</p>`;
                return;
            }

            vaultGrid.innerHTML = movieData.map(movie => `
                <div class="movie-card group" onclick="showDetails('${movie.id}')">
                    <div class="poster-wrapper">
                        <img src="${movie.posterPortrait}" class="transition-transform duration-700 group-hover:scale-110">
                        <div class="overlay-info">
                            <div class="text-[9px] text-red-500 font-bold tracking-widest uppercase mb-1">${movie.genre}</div>
                            <div class="text-xs font-bold uppercase tracking-tighter">${movie.title}</div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            renderHistory();
        }

        function renderHistory() {
            const historyGrid = document.getElementById('history-grid');
            if (!currentUser.history || currentUser.history.length === 0) {
                historyGrid.innerHTML = `<p class="text-neutral-600 italic col-span-full">Your viewing vault is currently empty.</p>`;
                return;
            }

            const historyMovies = currentUser.history
                .map(id => movieData.find(m => m.id === id))
                .filter(m => m !== undefined);

            historyGrid.innerHTML = historyMovies.map(movie => `
                <div class="movie-card group" onclick="showDetails('${movie.id}')">
                    <div class="poster-wrapper">
                        <img src="${movie.posterPortrait}" class="grayscale group-hover:grayscale-0 transition-all duration-700">
                        <div class="overlay-info">
                            <div class="text-[9px] text-neutral-500 font-bold tracking-widest uppercase mb-1">RECORDED</div>
                            <div class="text-xs font-bold uppercase tracking-tighter">${movie.title}</div>
                        </div>
                    </div>
                </div>
            `).reverse().join('');
        }

        function showDetails(id) {
            const movie = movieData.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('modal-hero').style.backgroundImage = `url('${movie.posterLandscape}')`;
            document.getElementById('modal-title').innerText = movie.title;
            document.getElementById('modal-genre').innerText = movie.genre;
            document.getElementById('modal-plot').innerText = movie.plot;
            
            document.getElementById('modal-play-btn').onclick = () => {
                addToHistory(movie.id);
                // origin=private ensures player knows to return here
                window.location.href = `video_player.html?id=${movie.id}&origin=private`; 
            };
            
            document.getElementById('details-modal').style.display = 'flex';
        }

        function addToHistory(movieId) {
            if (currentUser.history[currentUser.history.length - 1] !== movieId) {
                currentUser.history.push(movieId);
                if (currentUser.history.length > 20) currentUser.history.shift();
                
                let users = JSON.parse(localStorage.getItem('zenith_users') || '[]');
                const index = users.findIndex(u => u.username === currentUser.username);
                if (index !== -1) {
                    users[index].history = currentUser.history;
                    localStorage.setItem('zenith_users', JSON.stringify(users));
                }
            }
        }

        function closeDetails(e) {
            document.getElementById('details-modal').style.display = 'none';
        }

        // FIXED LOGOUT FUNCTION
        function logout() {
            localStorage.removeItem('zenith_session_user');
            // Redirect to public landing
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
